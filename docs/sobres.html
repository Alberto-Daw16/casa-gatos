:root{
  --bg:#0b0d13; --txt:#f4f2ee; --dim:#8f94a2; --line:#252a36;
  --acc:#c9f24a; --rojo:#b3122e; --rojo2:#e0455c; --oro:#f2c14e;
  --cw:250px; --ch:350px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.mono{font-family:"Space Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}

/* ── escenario ── */
#fondo{position:fixed;inset:0;background:
  radial-gradient(120% 70% at 50% 35%, rgba(179,18,46,.28), transparent 60%),
  radial-gradient(90% 60% at 50% 110%, rgba(201,242,74,.08), transparent 70%), var(--bg);
  transition:background 1s}
#fondo.dorado{background:radial-gradient(120% 70% at 50% 35%, rgba(242,193,78,.35), transparent 60%), var(--bg)}
#fondo.arcoiris{background:radial-gradient(120% 70% at 50% 35%, rgba(170,120,255,.35), transparent 55%),
  radial-gradient(80% 50% at 30% 70%, rgba(80,220,255,.18), transparent 60%), var(--bg)}
#chispas{position:fixed;inset:0;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:center;z-index:5}
header .t{font-size:26px}
header .c{font-size:10.5px;color:var(--dim)}
#escena{position:fixed;inset:0;display:grid;place-items:center;perspective:1200px}
#ayuda{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;font-size:11px;color:var(--dim);transition:opacity .4s;z-index:5}

/* ── el sobre ── */
.sobre{position:relative;width:236px;height:400px;transform-style:preserve-3d;animation:flota 3.2s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-8px) rotate(-.6deg)}}
.sobre .cuerpo,.sobre .tira{position:absolute;left:0;right:0;overflow:hidden;
  background:linear-gradient(160deg,#6e0a1c 0%,#b3122e 38%,#3a0610 100%)}
.sobre .tira{top:0;height:46px;border-radius:0;
  clip-path:polygon(0 18%,4% 0,8% 18%,12% 0,16% 18%,20% 0,24% 18%,28% 0,32% 18%,36% 0,40% 18%,44% 0,48% 18%,52% 0,56% 18%,60% 0,64% 18%,68% 0,72% 18%,76% 0,80% 18%,84% 0,88% 18%,92% 0,96% 18%,100% 0,100% 100%,0 100%);
  transform-origin:100% 100%;z-index:2}
.sobre .cuerpo{top:46px;bottom:0;
  clip-path:polygon(0 0,100% 0,100% 96%,96% 100%,92% 96%,88% 100%,84% 96%,80% 100%,76% 96%,72% 100%,68% 96%,64% 100%,60% 96%,56% 100%,52% 96%,48% 100%,44% 96%,40% 100%,36% 96%,32% 100%,28% 96%,24% 100%,20% 96%,16% 100%,12% 96%,8% 100%,4% 96%,0 100%)}
.sobre .brillo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);
  background-size:250% 100%;animation:barrido 3.5s ease-in-out infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes barrido{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.sobre .arte{position:absolute;inset:26px 18px 60px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(201,242,74,.18),transparent 60%)}
.sobre .arte .gatos{font-size:58px;letter-spacing:-6px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.sobre .arte .corona{position:absolute;top:18px;width:54px;height:54px;color:var(--acc)}

.btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--txt);padding:13px 18px;font:700 11px/1 "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase}

#zoom{position:fixed;inset:0;background:rgba(5,6,10,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:30;perspective:900px}

#album .rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#album .hueco{aspect-ratio:250/350;border:1.5px dashed var(--line);display:grid;place-items:center;color:#3a4050;font:700 11px "Space Mono",monospace;border-radius:8px}
#album .mini{position:relative;aspect-ratio:250/350}
#album .mini .carta{position:absolute;top:0;left:0;transform-origin:0 0}
#album .mini .cnt{position:absolute;bottom:-6px;right:-4px;z-index:6;background:#000;color:#fff;font:700 9px "Space Mono",monospace;padding:3px 5px;border:1px solid var(--line)}
</style>

  var atq = (c.a||[]).map(function(a){
    var en = ""; for(var i=0;i<Math.min(a[0],4);i++) en += "<i></i>";
    return '<div class="atq"><div class="en">'+en+'</div><div class="n">'+esc(a[1])+(a[2]?'<small>'+esc(a[2])+'</small>':'')+'</div><div class="d">'+(a[3]||"")+'</div></div>';
  }).join("");
  var txt = c.x ? '<div class="txt">'+esc(c.x)+'</div>' : "";
  return '<div class="carta r'+c.r+(c.r>=4?' brilla idle':'')+'" style="--tipo:'+T.c+';--fondoArte:'+T.fondo+'">'+
    '<div class="in">'+
      '<div class="top"><div class="fase">'+(c.t==="casa"?"Objeto":"Básico")+'</div></div>'+
      '<div class="top"><b>'+esc(c.n)+'</b>'+(c.ps?'<span class="ps">PS <em>'+c.ps+'</em></span>':'')+'<span class="tipo">'+T.i+'</span></div>'+
      '<div class="arte">'+arte+'</div>'+
      '<div class="sub">'+esc(c.f)+'</div>'+
      atq + txt + (c.t==="casa" ? "" : '<div class="dr">'+(DR[c.t]||DR.gato).map(function(x){ return '<span>'+x+'</span>'; }).join("")+'</div>') +
      '<div class="pie"><div class="fl">'+esc(c.fl)+'</div><div class="rz"><span>'+SIMB[c.r]+'</span>'+String(c.id).padStart(3,"0")+'/'+String(SET.length).padStart(3,"0")+'</div></div>'+
    '</div><div class="holo"></div><div class="glare"></div></div>';
}
/* el brillo sigue al dedo */
function holoSigue(el, x, y){
  var r = el.getBoundingClientRect(), px = (x-r.left)/r.width, py = (y-r.top)/r.height;
  el.style.setProperty("--hx", (px*100)+"%"); el.style.setProperty("--hy", (py*100)+"%");
  el.style.setProperty("--gx", (px*100)+"%"); el.style.setProperty("--gy", (py*100)+"%");
  el.classList.remove("idle");
  return {px:px, py:py};
}

/* ═════════ sonido (sintetizado, sin ficheros) ═════════ */
var AC = null;
function audio(){ if(!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function ruido(dur, desde, hasta, vol){
  var ac = audio(); if(!ac) return;
  var n = Math.floor(ac.sampleRate*dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  var s = ac.createBufferSource(); s.buffer = b;
  var f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 0.8;
  f.frequency.setValueAtTime(desde, ac.currentTime); f.frequency.exponentialRampToValueAtTime(hasta, ac.currentTime+dur);
  var g = ac.createGain(); g.gain.value = vol||0.5;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
function nota(fr, t0, dur, tipo, vol){
  var ac = audio(); if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo||"sine"; o.frequency.value = fr;
  g.gain.setValueAtTime(0.0001, ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18, ac.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+0.05);
}
function sRasgar(){ ruido(0.35, 5000, 1200, 0.6); }
function sPasa(){ ruido(0.12, 2500, 900, 0.25); }
function sRara(nivel){
  var base = [523.25, 659.25, 783.99, 1046.5, 1318.5];
  base.slice(0, 3+Math.min(2, nivel-3)).forEach(function(f,i){ nota(f, i*0.09, 0.9, "triangle", 0.16); });
  if(nivel>=6) [1567.98, 2093].forEach(function(f,i){ nota(f, 0.5+i*0.12, 1.4, "sine", 0.12); });
}

/* ═════════ chispas (canvas) ═════════ */
var cv = document.getElementById("chispas"), cx = cv.getContext("2d"), parts = [];
function tam(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
tam(); addEventListener("resize", tam);
function chispas(x, y, n, colores){
  for(var i=0;i<n;i++){ var a = Math.random()*Math.PI*2, v = 2+Math.random()*7;
    parts.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-2, v:1, c:colores[i%colores.length], r:1.5+Math.random()*2.5}); }
}
(function bucle(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(function(p){ return p.v > 0; });
  parts.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.vx *= 0.985; p.v -= 0.014;
    cx.globalAlpha = Math.max(0,p.v); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); });
  cx.globalAlpha = 1; requestAnimationFrame(bucle);
})();

/* ═════════ el flujo: sobre → rasgar → pila → resumen ═════════ */
var escena = document.getElementById("escena"), ayuda = document.getElementById("ayuda"), fondo = document.getElementById("fondo");
var sobreAct = null;

function mejorDe(cs){ return cs.reduce(function(m,c){ return c.r > m ? c.r : m; }, 0); }

function nuevoSobre(){
  document.getElementById("resumen").classList.remove("on");
  document.getElementById("botones").style.display = "none";
  fondo.className = "";
  var cartas = generaSobre(), top = mejorDe(cartas);
  sobreAct = cartas;
  escena.innerHTML =
    '<div class="sobre'+(top>=6?' aura iris':(top>=4?' aura oro':''))+'" id="sobre">'+
      '<div class="tira"><div class="brillo"></div></div>'+
      '<div class="cuerpo"><div class="brillo"></div>'+
        '<div class="arte"><div class="corona">'+CORONA+'</div><div class="gatos">🦊👺🐂</div></div>'+
        '<div class="marca"><b>Gremory</b><small class="mono">Set 1 · La casa · 5 cartas</small></div>'+
      '</div>'+
      '<div class="linea"></div><div class="corte" id="corte"></div>'+
    '</div>';
  ayuda.textContent = "Desliza el dedo por la línea para abrirlo"; ayuda.style.opacity = 1;
  preparaRasgado(document.getElementById("sobre"));
}

function preparaRasgado(sb){
  var corte = document.getElementById("corte"), ini = null, hecho = false;
  function pos(e){ var r = sb.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top, w:r.width, h:r.height}; }
  sb.addEventListener("pointerdown", function(e){
    audio();
    var p = pos(e);
    if(p.y > 110){ sb.classList.remove("tiembla"); void sb.offsetWidth; sb.classList.add("tiembla"); return; }  // solo por arriba
    ini = p; sb.setPointerCapture(e.pointerId);
  });
  sb.addEventListener("pointermove", function(e){
    if(!ini || hecho) return;
    var p = pos(e), avance = Math.max(0, Math.min(1, (p.x - ini.x) / (p.w*0.8)));
    corte.style.width = (avance*100)+"%";
    if(Math.random() < 0.35) { var r = sb.getBoundingClientRect(); chispas(r.left + avance*r.width, r.top+46, 2, ["#fff","#c9f24a"]); }
    if(avance >= 0.95){ hecho = true; abre(sb); }
  });
  sb.addEventListener("pointerup", function(){ if(!hecho){ corte.style.transition = "width .25s"; corte.style.width = "0"; setTimeout(function(){ corte.style.transition = ""; }, 260); } ini = null; });
}

function abre(sb){
  sRasgar();
  var r = sb.getBoundingClientRect();
  chispas(r.left + r.width/2, r.top + 46, 40, ["#fff","#c9f24a","#ff8fa8"]);
  sb.classList.add("roto");
  ayuda.style.opacity = 0;
  setTimeout(function(){ sb.classList.add("baja"); muestraPila(); }, 650);
}

var pila = [], idx = 0;
function muestraPila(){
  var cs = sobreAct, top = mejorDe(cs);
  if(top >= 6) fondo.className = "arcoiris"; else if(top >= 4) fondo.className = "dorado";
  var html = '<div class="pila sube" id="pila">';
  /* la de abajo (la última) es la buena: se pinta primero */
  for(var i=cs.length-1;i>=0;i--){
    var c = cs[i], rara = c.r >= 4;
    html += '<div class="c" data-i="'+i+'" style="z-index:'+(10-i)+';transform:translateY('+(i*-3)+'px) rotate('+((i%2?1:-1)*i*0.8)+'deg)">'+
      '<div class="volteo'+(rara?' dorso':'')+'"><div class="cara">'+cartaHTML(c)+'</div>'+
      '<div class="reverso'+(rara?' late':'')+'">'+CORONA+'</div></div>'+
      (col[c.id] ? '' : '<div class="nueva">NUEVA</div>')+
      '</div>';
  }
  html += '<div class="rayos" id="rayos"></div></div>';
  escena.insertAdjacentHTML("beforeend", html);
  idx = 0;
  setTimeout(function(){ var pl = document.getElementById("pila"); if(pl) pl.classList.remove("sube"); ayuda.textContent = "Desliza la carta hacia un lado"; ayuda.style.opacity = 1; activa(); }, 950);
}

function cartaActual(){ return document.querySelector('#pila .c[data-i="'+idx+'"]'); }
function activa(){
  var el = cartaActual(); if(!el) return fin();
  var c = sobreAct[idx], vol = el.querySelector(".volteo"), carta = el.querySelector(".carta");
  var x0 = null, dx = 0, girada = !vol.classList.contains("dorso");
  if(!girada) ayuda.textContent = "Algo brilla… tócala para darle la vuelta";
  function revela(){
    girada = true; vol.classList.remove("dorso");
    sRara(c.r);
    var r = el.getBoundingClientRect();
    setTimeout(function(){
      document.getElementById("flash").classList.add("on");
      setTimeout(function(){ document.getElementById("flash").classList.remove("on"); }, 650);
      document.getElementById("rayos").classList.add("on");
      chispas(r.left+r.width/2, r.top+r.height/2, c.r>=6?160:90, c.r>=6?["#fff3c4","#e2b33c","#ff5c8a","#5cc8ff","#b45cff"]:["#fff3c4","#e2b33c","#fff"]);
      ayuda.textContent = NOMBRE_R[c.r]+" · desliza para seguir";
    }, 380);
  }
  el.onpointerdown = function(e){
    audio();
    if(!girada){ revela(); return; }
    x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = "none";
  };
  el.onpointermove = function(e){
    if(girada && carta.classList.contains("brilla")) holoSigue(carta, e.clientX, e.clientY);
    if(x0 === null) return;
    dx = e.clientX - x0;
    el.style.transform = "translateX("+dx+"px) rotate("+(dx/14)+"deg)";
  };
  el.onpointerup = function(){
    if(x0 === null) return;
    el.style.transition = "";
    if(Math.abs(dx) > 70){
      sPasa();
      el.style.transform = "translateX("+(dx>0?1:-1)*innerWidth*1.2+"px) rotate("+(dx>0?35:-35)+"deg)";
      el.style.opacity = 0; el.style.pointerEvents = "none";
      el.onpointerdown = el.onpointermove = el.onpointerup = null;
      col[c.id] = (col[c.id]||0) + 1; guarda(); pintaCuenta();
      idx++; x0 = null; dx = 0;
      setTimeout(activa, 220);
    } else { el.style.transform = ""; x0 = null; dx = 0; }
  };
}

function fin(){
  ayuda.style.opacity = 0;
  var cs = sobreAct, nuevasAntes = {};
  var rej = document.getElementById("rejilla");
  rej.innerHTML = cs.map(function(c, i){
    return '<div class="mini" style="animation-delay:'+(i*0.08)+'s" data-z="'+c.id+'">'+cartaHTML(c)+
      (col[c.id]===1 ? '<div class="nueva">NUEVA</div>' : '')+'</div>';
  }).join("");
  document.getElementById("resumen").classList.add("on");
  document.getElementById("botones").style.display = "flex";
  escena.innerHTML = "";
}

/* ═════════ zoom con inclinación ═════════ */
var zoom = document.getElementById("zoom"), gira = document.getElementById("gira");
function abreZoom(id){
  var c = SET.filter(function(x){ return x.id===+id; })[0]; if(!c) return;
  gira.innerHTML = cartaHTML(c); zoom.classList.add("on"); gira.style.transform = "";
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function" && !abreZoom.pedido){
    abreZoom.pedido = true;
    DeviceOrientationEvent.requestPermission().then(function(p){ if(p==="granted") addEventListener("deviceorientation", inclina); }).catch(function(){});
  } else if(!abreZoom.pedido){ abreZoom.pedido = true; addEventListener("deviceorientation", inclina); }
}
function inclina(e){
  if(!zoom.classList.contains("on") || e.gamma===null) return;
  var gx = Math.max(-25, Math.min(25, e.gamma)), gy = Math.max(-25, Math.min(25, (e.beta||45) - 45));
  gira.style.transform = "rotateY("+gx+"deg) rotateX("+(-gy)+"deg)";
  var carta = gira.querySelector(".carta"); if(!carta) return;
  var r = carta.getBoundingClientRect();
  holoSigue(carta, r.left + r.width*(0.5+gx/50), r.top + r.height*(0.5+gy/50));
}
zoom.addEventListener("pointermove", function(e){
  var carta = gira.querySelector(".carta"); if(!carta) return;
  var p = holoSigue(carta, e.clientX, e.clientY);
  gira.style.transform = "rotateY("+((p.px-0.5)*36)+"deg) rotateX("+((0.5-p.py)*36)+"deg)";
});
zoom.addEventListener("pointerdown", function(e){ if(!e.target.closest(".carta")) zoom.classList.remove("on"); });
document.getElementById("rejilla").addEventListener("click", function(e){ var m = e.target.closest("[data-z]"); if(m) abreZoom(m.dataset.z); });

/* ═════════ álbum ═════════ */
var album = document.getElementById("album");
function abreAlbum(){
  var n = Object.keys(col).length, esc_ = 0;
  album.innerHTML = '<h2>Álbum · Set 1</h2><p class="mono">'+n+' de '+SET.length+' · toca una carta para verla</p><div class="rejilla">'+
    SET.map(function(c){
      if(!col[c.id]) return '<div class="hueco">'+String(c.id).padStart(3,"0")+'</div>';
      return '<div class="mini" data-z="'+c.id+'">'+cartaHTML(c)+(col[c.id]>1?'<div class="cnt">×'+col[c.id]+'</div>':'')+'</div>';
    }).join("")+'</div>';
  album.classList.add("on");
  requestAnimationFrame(function(){
    album.querySelectorAll(".mini").forEach(function(m){ var s = m.clientWidth/250; m.querySelector(".carta").style.transform = "scale("+s+")"; });
  });
  document.getElementById("bAlbum").textContent = "Cerrar";
}
album.addEventListener("click", function(e){ var m = e.target.closest("[data-z]"); if(m) abreZoom(m.dataset.z); });
document.getElementById("bAlbum").onclick = function(){
  if(album.classList.contains("on")){ album.classList.remove("on"); this.textContent = "Álbum"; }
  else abreAlbum();
};
document.getElementById("bOtro").onclick = function(){ album.classList.remove("on"); document.getElementById("bAlbum").textContent = "Álbum"; nuevoSobre(); };

pintaCuenta();
nuevoSobre();
})();
</script>
